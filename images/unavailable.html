<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unavailable</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce4ec, #f8bbd0, #e1bee7);
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      background: white;
      border-radius: 2rem;
      padding: 3rem 2.5rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(233, 30, 99, 0.12);
      max-width: 380px;
      width: 90%;
    }

    .emoji { font-size: 5rem; animation: bounce 1.5s infinite; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-12px); }
    }

    h1 {
      margin: 1rem 0 0.5rem;
      font-size: 1.6rem;
      color: #e91e63;
    }

    p {
      color: #888;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .dots span {
      display: inline-block;
      width: 10px; height: 10px;
      margin: 1.5rem 4px 0;
      border-radius: 50%;
      background: #f48fb1;
      animation: pulse 1.2s infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🌸</div>
    <h1>Oops, we're away!</h1>
    <p>Images are taking a little nap right now.<br>Please check back in a moment! 🐾</p>
    <div class="dots">
      <span></span><span></span><span></span>
    </div>
  </div>
</body>
</html>
