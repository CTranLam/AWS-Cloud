AWSTemplateFormatVersion: '2010-09-09'
Description: App stack - ALB, Launch Template, Auto Scaling Group

Parameters:
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2 AMI ID for your region
  InstanceType:
    Type: String
    Default: t3.micro

Resources:
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue NetworkStack-VpcId
      Protocol: HTTP
      Port: 80
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      Tags:
        - Key: Name
          Value: main-tg

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !ImportValue NetworkStack-PublicSubnet1
        - !ImportValue NetworkStack-PublicSubnet2
      SecurityGroups:
        - !ImportValue NetworkStack-PublicSG
      Tags:
        - Key: Name
          Value: main-alb

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !ImportValue NetworkStack-PrivateSG
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            echo "OK" > /var/www/html/health

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      VPCZoneIdentifier:
        - !ImportValue NetworkStack-PrivateSubnet1
        - !ImportValue NetworkStack-PrivateSubnet2
      TargetGroupARNs:
        - !Ref TargetGroup
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - Key: Name
          Value: main-asg
          PropagateAtLaunch: true
