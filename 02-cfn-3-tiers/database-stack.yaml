AWSTemplateFormatVersion: '2010-09-09'
Description: Database stack - Aurora cluster, DB subnet group, security group, Secrets Manager

Resources:
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: aurora-db-credentials
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        ExcludePunctuation: true

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !ImportValue NetworkStack-VpcId
      GroupDescription: Allow Aurora access from private security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !ImportValue NetworkStack-PrivateSG
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !ImportValue NetworkStack-PrivateSG
      Tags:
        - Key: Name
          Value: db-sg

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora subnet group using private subnets
      SubnetIds:
        - !ImportValue NetworkStack-PrivateSubnet1
        - !ImportValue NetworkStack-PrivateSubnet2
      Tags:
        - Key: Name
          Value: aurora-subnet-group

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Properties:
      Engine: aurora-mysql
      EngineVersion: 8.0.mysql_aurora.3.04.0
      DBClusterIdentifier: main-aurora-cluster
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !Ref DBSecurityGroup
      StorageEncrypted: true
      DeletionProtection: false
      Tags:
        - Key: Name
          Value: main-aurora-cluster
