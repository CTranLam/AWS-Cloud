AWSTemplateFormatVersion: '2010-09-09'
Description: Demo 14 - Cross-Stack References (consumer) - imports values from producer stack

Parameters:
  # AWS::SSM::Parameter::Value<AWS::EC2::Image::Id> resolves the SSM path at deploy time
  # No need to look up or hardcode AMI IDs — always gets the latest for the current region
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64

  InstanceType:
    Type: String
    AllowedValues:
      - t4g.micro
      - t4g.small
    Description: Select an EC2 instance type for your stack.
    Default: t4g.micro
Resources:
  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Fn::ImportValue pulls the exported value from the producer stack
      VpcId: !ImportValue Demo14-VpcId
      GroupDescription: Allow HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      NetworkInterfaces:   
        - DeviceIndex: 0
          SubnetId: !ImportValue Demo14-SubnetId                                                                    
          GroupSet: [!Ref WebSG]
          AssociatePublicIpAddress: false
      ImageId: !Ref AmiId
      Tags:
        - Key: Name
          Value: demo-14-cross-stack-ref

Outputs:
  ImportedVpcId:
    Value: !ImportValue Demo14-VpcId
  ImportedSubnetId:
    Value: !ImportValue Demo14-SubnetId
