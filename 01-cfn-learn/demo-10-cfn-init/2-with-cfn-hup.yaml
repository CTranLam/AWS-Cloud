AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Demo 10b - cfn-hup: automatically re-runs cfn-init when stack Metadata changes.
  Step 1: Deploy this stack — page shows "Hello from cfn-init".
  Step 2: Run `aws cloudformation update-stack` with the updated Metadata (change index.html content).
  Step 3: cfn-hup detects the Metadata change and re-runs cfn-init — page updates without replacing the instance.

Parameters:
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetId:
    Type: AWS::EC2::Subnet::Id

Resources:
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess
      Policies:
        - PolicyName: AllowCfnSignal
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: cloudformation:SignalResource
                Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  WebSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref VpcId
      GroupDescription: Allow HTTP
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  WebServer:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        config:
          packages:
            yum:
              httpd: []
          files:
            # --- Change this content and update the stack to trigger cfn-hup ---
            /var/www/html/index.html:
              content: !Sub '<html><body><h1>Hello from cfn-init! Today is the best day to learn AWS!</h1></body></html>'
              mode: '000644'

            # cfn-hup daemon config — points to this stack and region
            /etc/cfn/cfn-hup.conf:
              content: !Sub |
                [main]
                stack=${AWS::StackId}
                region=${AWS::Region}
                interval=1
              mode: '000400'
              owner: root
              group: root

            # Hook: when Metadata on WebServer changes, re-run cfn-init
            /etc/cfn/hooks.d/cfn-auto-reloader.conf:
              content: !Sub |
                [cfn-auto-reloader-hook]
                triggers=post.update
                path=Resources.WebServer.Metadata.AWS::CloudFormation::Init
                action=/opt/aws/bin/cfn-init -v \
                  --stack ${AWS::StackName} \
                  --resource WebServer \
                  --region ${AWS::Region}
                runas=root
              mode: '000400'
              owner: root
              group: root

          services:
            sysvinit:
              httpd:
                enabled: true
                ensureRunning: true
              # cfn-hup runs as a daemon, polling for Metadata changes every `interval` minutes
              cfn-hup:
                enabled: true
                ensureRunning: true
                files:
                  - /etc/cfn/cfn-hup.conf
                  - /etc/cfn/hooks.d/cfn-auto-reloader.conf

    CreationPolicy:
      ResourceSignal:
        Timeout: PT5M

    Properties:
      InstanceType: t4g.micro
      ImageId: !Ref AmiId
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:   
        - DeviceIndex: 0
          SubnetId:   !Ref SubnetId                                                                                      
          GroupSet: [!Ref WebSG]
          AssociatePublicIpAddress: true
      UserData:
        Fn::Base64:
          !Sub |
            #!/bin/bash -xe
            yum update -y aws-cfn-bootstrap
            /opt/aws/bin/cfn-init -v \
              --stack ${AWS::StackName} \
              --resource WebServer \
              --region ${AWS::Region}
            /opt/aws/bin/cfn-signal -e $? \
              --stack ${AWS::StackName} \
              --resource WebServer \
              --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: demo-10b-cfn-hup

Outputs:
  PublicIp:
    Value: !GetAtt WebServer.PublicIp
    Description: Open in browser to see the page — update Metadata to trigger cfn-hup
