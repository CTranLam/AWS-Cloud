<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWS Architecting Capstone - CRM Application</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: #f8f9fa;
      padding: 30px;
      text-align: center;
    }
    h1 { color: #333; font-size: 2rem; margin-bottom: 15px; }
    .metadata {
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 15px;
    }
    .metadata span { background: white; padding: 8px 16px; border-radius: 6px; }
    .stress-control {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
    }
    .stress-control input { width: 80px; padding: 6px; border: 2px solid #e0e0e0; border-radius: 6px; }
    .stress-btn {
      padding: 6px 16px;
      background: #ff6b6b;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .stress-btn:hover { background: #ee5a52; }
    .stop-btn { background: #28a745; }
    .stop-btn:hover { background: #218838; }
    .tabs {
      display: flex;
      border-bottom: 2px solid #e0e0e0;
      background: #f8f9fa;
    }
    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      border: none;
      background: transparent;
      font-size: 1rem;
      transition: all 0.3s;
      color: #6c757d;
    }
    .tab:hover { 
      background: #e9ecef;
      color: #495057;
    }
    .tab.active {
      background: white;
      border-bottom: 3px solid #667eea;
      font-weight: 600;
      color: #667eea;
    }
    .content {
      padding: 40px;
      display: none;
    }
    .content.active { display: block; }
    .form {
      display: grid;
      gap: 15px;
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
    }
    input, textarea {
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    input:focus, textarea:focus { outline: none; border-color: #667eea; }
    textarea { resize: vertical; min-height: 80px; }
    button {
      padding: 12px 24px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #5568d3; }
    .items { display: grid; gap: 15px; }
    .item {
      display: flex;
      gap: 20px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    .item:hover { transform: translateY(-2px); }
    .item-image {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      object-fit: cover;
      background: #e0e0e0;
    }
    .item-info { flex: 1; }
    .item-info h3 { color: #333; margin-bottom: 5px; }
    .item-info p { color: #666; margin-bottom: 3px; font-size: 0.9rem; }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .edit-btn {
      padding: 8px 16px;
      background: #28a745;
      font-size: 0.9rem;
    }
    .edit-btn:hover { background: #218838; }
    .delete-btn {
      padding: 8px 16px;
      background: #dc3545;
      font-size: 0.9rem;
    }
    .delete-btn:hover { background: #c82333; }
    @media (max-width: 768px) {
      .container { border-radius: 0; }
      .header { padding: 20px; }
      h1 { font-size: 1.5rem; }
      .metadata { flex-direction: column; gap: 10px; }
      .content { padding: 20px; }
      .item { flex-direction: column; }
      .actions { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>CRM Application - Capstone Project</h1>
      <div class="metadata">
        <span>Region: <strong id="region">Loading...</strong></span>
        <span>Instance: <strong id="instanceId">Loading...</strong></span>
      </div>
      <div class="stress-control">
        <input type="number" id="stressDuration" value="60" min="10" max="300">
        <span>seconds</span>
        <button class="stress-btn" onclick="startStress()">Start CPU Stress</button>
        <button class="stress-btn stop-btn" onclick="stopStress()">Stop</button>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('products')">Products (Aurora & S3)</button>
      <button class="tab" onclick="switchTab('customers')">Customers (DynamoDB & EFS)</button>
    </div>

    <div id="products" class="content active">
      <div class="form">
        <input type="text" id="productName" placeholder="Product Name" required>
        <input type="number" id="productQty" placeholder="Quantity" required min="0">
        <input type="file" id="productImage" accept="image/*">
        <button id="productSubmitBtn" onclick="saveProduct()">Add Product</button>
      </div>
      <div class="items" id="productsList"></div>
    </div>

    <div id="customers" class="content">
      <div class="form">
        <input type="text" id="customerName" placeholder="Customer Name" required>
        <input type="text" id="customerLocation" placeholder="Location">
        <input type="date" id="customerDob" placeholder="Date of Birth">
        <textarea id="customerDescription" placeholder="Description"></textarea>
        <input type="file" id="customerAvatar" accept="image/*">
        <button id="customerSubmitBtn" onclick="saveCustomer()">Add Customer</button>
      </div>
      <div class="items" id="customersList"></div>
    </div>
  </div>

  <script>
    let editingProductId = null;
    let editingCustomerId = null;
    let stressRunning = false;

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab).classList.add('active');
      if (tab === 'products') loadProducts();
      if (tab === 'customers') loadCustomers();
    }

    async function loadMetadata() {
      try {
        const res = await fetch('/api/metadata');
        const data = await res.json();
        document.getElementById('region').textContent = data.region;
        document.getElementById('instanceId').textContent = data.instanceId;
      } catch (err) {
        console.error('Failed to load metadata:', err);
      }
    }

    function updateStressButtons() {
      const startBtn = document.querySelector('.stress-btn:not(.stop-btn)');
      const stopBtn = document.querySelector('.stop-btn');
      const durationInput = document.getElementById('stressDuration');
      
      if (stressRunning) {
        startBtn.disabled = true;
        startBtn.style.opacity = '0.5';
        stopBtn.disabled = false;
        stopBtn.style.opacity = '1';
        durationInput.disabled = true;
      } else {
        startBtn.disabled = false;
        startBtn.style.opacity = '1';
        stopBtn.disabled = true;
        stopBtn.style.opacity = '0.5';
        durationInput.disabled = false;
      }
    }

    async function startStress() {
      if (stressRunning) return;
      const duration = document.getElementById('stressDuration').value;
      try {
        const res = await fetch('/api/stress', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ duration: parseInt(duration) })
        });
        const data = await res.json();
        if (data.status === 'started') {
          stressRunning = true;
          updateStressButtons();
          alert(`CPU stress started for ${duration} seconds`);
          setTimeout(() => {
            stressRunning = false;
            updateStressButtons();
          }, duration * 1000);
        }
      } catch (err) {
        alert('Failed to start stress test');
      }
    }

    async function stopStress() {
      if (!stressRunning) return;
      try {
        const res = await fetch('/api/stress', { method: 'DELETE' });
        stressRunning = false;
        updateStressButtons();
        alert('CPU stress stopped');
      } catch (err) {
        alert('Failed to stop stress test');
      }
    }

    // PRODUCTS
    async function loadProducts() {
      const res = await fetch('/api/products');
      const products = await res.json();
      document.getElementById('productsList').innerHTML = products.map(p => `
        <div class="item">
          ${p.image_url ? `<img src="${p.image_url}" class="item-image" alt="${p.name}">` : '<div class="item-image"></div>'}
          <div class="item-info">
            <h3>${p.name}</h3>
            <p>Quantity: ${p.qty}</p>
          </div>
          <div class="actions">
            <button class="edit-btn" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
            <button class="delete-btn" onclick="deleteProduct(${p.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function saveProduct() {
      const name = document.getElementById('productName').value;
      const qty = document.getElementById('productQty').value;
      const image = document.getElementById('productImage').files[0];
      if (!name || !qty) return alert('Please fill required fields');

      const formData = new FormData();
      formData.append('name', name);
      formData.append('qty', qty);
      if (image) formData.append('image', image);

      const url = editingProductId ? `/api/products/${editingProductId}` : '/api/products';
      const method = editingProductId ? 'PUT' : 'POST';

      await fetch(url, { method, body: formData });

      document.getElementById('productName').value = '';
      document.getElementById('productQty').value = '';
      document.getElementById('productImage').value = '';
      document.getElementById('productSubmitBtn').textContent = 'Add Product';
      editingProductId = null;
      loadProducts();
    }

    function editProduct(product) {
      editingProductId = product.id;
      document.getElementById('productName').value = product.name;
      document.getElementById('productQty').value = product.qty;
      document.getElementById('productSubmitBtn').textContent = 'Update Product';
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product?')) return;
      await fetch(`/api/products/${id}`, { method: 'DELETE' });
      loadProducts();
    }

    // CUSTOMERS
    async function loadCustomers() {
      const res = await fetch('/api/customers');
      const customers = await res.json();
      document.getElementById('customersList').innerHTML = customers.map(c => `
        <div class="item">
          ${c.avatar ? `<img src="${c.avatar}" class="item-image" alt="${c.name}">` : '<div class="item-image"></div>'}
          <div class="item-info">
            <h3>${c.name}</h3>
            <p>Location: ${c.location || 'N/A'}</p>
            <p>DOB: ${c.dob || 'N/A'}</p>
            <p>${c.description || ''}</p>
          </div>
          <div class="actions">
            <button class="edit-btn" onclick='editCustomer(${JSON.stringify(c)})'>Edit</button>
            <button class="delete-btn" onclick="deleteCustomer('${c.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    async function saveCustomer() {
      const name = document.getElementById('customerName').value;
      const location = document.getElementById('customerLocation').value;
      const dob = document.getElementById('customerDob').value;
      const description = document.getElementById('customerDescription').value;
      const avatar = document.getElementById('customerAvatar').files[0];
      if (!name) return alert('Please enter customer name');

      const formData = new FormData();
      formData.append('name', name);
      formData.append('location', location);
      formData.append('dob', dob);
      formData.append('description', description);
      if (avatar) formData.append('avatar', avatar);

      const url = editingCustomerId ? `/api/customers/${editingCustomerId}` : '/api/customers';
      const method = editingCustomerId ? 'PUT' : 'POST';

      await fetch(url, { method, body: formData });

      document.getElementById('customerName').value = '';
      document.getElementById('customerLocation').value = '';
      document.getElementById('customerDob').value = '';
      document.getElementById('customerDescription').value = '';
      document.getElementById('customerAvatar').value = '';
      document.getElementById('customerSubmitBtn').textContent = 'Add Customer';
      editingCustomerId = null;
      loadCustomers();
    }

    function editCustomer(customer) {
      editingCustomerId = customer.id;
      document.getElementById('customerName').value = customer.name;
      document.getElementById('customerLocation').value = customer.location || '';
      document.getElementById('customerDob').value = customer.dob || '';
      document.getElementById('customerDescription').value = customer.description || '';
      document.getElementById('customerSubmitBtn').textContent = 'Update Customer';
    }

    async function deleteCustomer(id) {
      if (!confirm('Delete this customer?')) return;
      await fetch(`/api/customers/${id}`, { method: 'DELETE' });
      loadCustomers();
    }

    loadMetadata();
    loadProducts();
    updateStressButtons();
  </script>
</body>
</html>
